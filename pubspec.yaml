name: altaria
description: "Ad-free SoundCloud listening and strength training, in one app."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.14.0

dependencies:
  audio_service: ^0.18.19
  file_picker: ^8.3.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  http: ^1.6.0
  just_audio: ^0.10.6
  material_ui: ^1.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  sqflite: ^2.4.2
  timezone: ^0.10.1
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Jost.txt

  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#5A1414"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: true
