name: altaria
description: "An ad-free SoundCloud client for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audio_service: ^0.18.19
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Jost.txt

  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#5A1414"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: true
